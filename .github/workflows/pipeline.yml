name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest --cov=main --cov=scripts --cov-report=term-missing --cov-fail-under=90

  docker:
    # Build the image and run it, so a broken Dockerfile or a service that does not start fails here,
    # not in production.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t service:ci .
      - run: docker run -d --name svc -p 8000:8000 -e GIT_SHA=${{ github.sha }} service:ci
      - name: Smoke test the running container
        run: python3 scripts/smoke_test.py http://localhost:8000 --sha "${{ github.sha }}" --timeout 60 --interval 2
      - name: Container logs
        if: failure()
        run: docker logs svc

  deploy:
    needs: [lint, test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SERVICE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Trigger the Render deploy for this exact commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not set (see README, step 3)"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}" > /dev/null
          echo "Deploy requested for ${GITHUB_SHA}"
      - name: Wait until this commit is live and healthy
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: |
          if [ -z "$SERVICE_URL" ]; then
            echo "::error::Variable SERVICE_URL is not set (see README, step 3)"
            exit 1
          fi
          python3 scripts/smoke_test.py "$SERVICE_URL" --sha "$GITHUB_SHA" --timeout 900 --interval 15
